data:
  csv_path: "data/raw/leo_satellite_conjunction_telemetry_enriched_2026.csv"
  batch_size: 256
  seed: 42

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  physics_lambda: 0.005

model:
  hidden_dim: 128

outputs:
  checkpoint_dir: "outputs/checkpoints"
  figure_dir: "outputs/figures"